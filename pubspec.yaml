name: fluxo_ia
description: Aplicativo pessoal de gestão financeira com inteligência artificial.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  file_selector: ^1.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.15
  shared_preferences: ^2.5.3
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
