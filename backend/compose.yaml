services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluxo_ia
      POSTGRES_USER: fluxo_ia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - fluxo_ia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo_ia -d fluxo_ia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://fluxo_ia:${POSTGRES_PASSWORD}@postgres:5432/fluxo_ia
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fluxo_ia_postgres:
